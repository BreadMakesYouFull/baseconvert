[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baseconvert"
dynamic = ["version"]
description = "Convert numbers between bases."
readme = "README.rst"
requires-python = ">=3"
license = "MIT"
authors = [{ name = "squdle, BreadMakesYouFull" }]
keywords = [
    "base", "bases", "radix", "numeral system", "number", "hex", "dec",
    "bin", "hexidecimal", "binary", "decimal", "fraction", "fractions",
    "integer", "convert", "gui",
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Education",
]

[project.optional-dependencies]
gui = ["pyside6"]

[project.scripts]
baseconvert = "baseconvert.gui:main"

[tool.setuptools.dynamic]
version = { file = "VERSION.txt" }

[tool.setuptools.packages.find]
include = ["baseconvert*"]

[tool.setuptools.package-data]
baseconvert = ["*.qml"]
